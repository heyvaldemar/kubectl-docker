# Keeps the pinned GitHub Actions current. Every workflow in this repository
# pins its actions to a commit SHA, which is what makes a supply-chain attack
# on a tag harmless here — and also what makes them go stale silently, because
# a pinned SHA never moves on its own.
#
# GROUPED INTO ONE PULL REQUEST, deliberately. Ungrouped, a week where four
# actions publish releases arrives as four pull requests per repository, and
# across the fleet that is a review queue nobody reads to the end. One request
# per repository per week is a queue that gets read.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # The Debian base is pinned by digest, and Debian repushes trixie-slim every
  # few weeks with security fixes. Until 2026-10-28 that pin moved only when a
  # person read the freshness alarm and opened a pull request; the fleet triage
  # reported it as "needs a human" each time. Dependabot now opens that pull
  # request, the real build gates it, and the auto-merge workflow merges it.
  #
  # DAILY, AT 03:00 UTC, deliberately: before the freshness check at 05:30, so
  # a repush is usually carried before the alarm can read it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "build"
