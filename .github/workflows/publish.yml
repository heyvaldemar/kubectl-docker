name: Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild: every line gets its current patch release and the
    # week's Debian security updates. The pinned base digest never moves in
    # this build: a commit on main moves it, a person's or, for a base
    # re-pushed with the same toolchain, the fleet triage's.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: heyvaldemar/kubectl

jobs:
  lint:
    name: Lint Dockerfile and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/*.sh

  versions:
    name: Resolve the kubectl lines to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      # THE THREE NEWEST KUBERNETES MINORS, the window upstream supports, each
      # with its current patch release. A minor that falls out of the three
      # keeps its last image and stops moving.
      - name: The newest three minors and their current patch releases
        id: lines
        run: |
          set -euo pipefail
          newest="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          minor="${newest#v}"; minor="${minor%.*}"
          major="${minor%%.*}"; m="${minor#*.}"
          lines='[]'
          for i in 0 1 2; do
            line="${major}.$((m - i))"
            version="$(curl -fsSL "https://dl.k8s.io/release/stable-${line}.txt")"
            # Strictly vMAJOR.MINOR.PATCH on this line: the value reaches build
            # arguments and tag names, so nothing else is let through.
            if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "${version%.*}" != "v${line}" ]; then
              echo "::error::stable-${line}.txt answered something that is not a v${line}.N release"; exit 1
            fi
            lines="$(jq -c --arg minor "$line" --arg version "$version" --argjson newest "$([ "$i" = 0 ] && echo true || echo false)" \
              '. + [{minor: $minor, version: $version, newest: $newest}]' <<<"$lines")"
          done
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "$lines" | jq .

  test:
    name: Test kubectl ${{ matrix.line.minor }} before it is published
    runs-on: ubuntu-latest
    needs: [lint, versions]
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.versions.outputs.lines) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image for this runner
        env:
          KUBE_VERSION: ${{ matrix.line.version }}
        run: docker build --build-arg "KUBE_VERSION=${KUBE_VERSION}" -t kubectl:local .

      # Every promised tool answers, kubectl is the version the image says,
      # it runs as 1001:0 with HOME=/ and a writable /.kube, and Bitnami's
      # paths run.
      - name: Smoke test
        run: ./scripts/smoke-test.sh kubectl:local

      # The same user, entrypoint, command and HOME as the last versioned
      # bitnami/kubectl, and every executable on its PATH, or a reason.
      - name: A drop-in for bitnami/kubectl
        run: ./tests/drop-in-test.sh kubectl:local

      # Nothing a pipeline used yesterday is gone today: every executable on
      # the published image's PATH, its user, HOME, working directory,
      # entrypoint and command, and kubectl on this tag's minor.
      - name: The contract with what is already published
        env:
          MINOR: ${{ matrix.line.minor }}
        run: ./scripts/contract-test.sh kubectl:local "heyvaldemar/kubectl:${MINOR}" "$MINOR"

      - name: The tests, shown each violation they exist for
        if: matrix.line.newest
        env:
          KUBE_VERSION: ${{ matrix.line.version }}
        run: python3 tests/plant-violations.py -- bash -c "docker build -q --build-arg KUBE_VERSION=${KUBE_VERSION} -t kubectl:plant . >/dev/null && ./scripts/smoke-test.sh kubectl:plant >/dev/null 2>&1 && ./tests/drop-in-test.sh kubectl:plant >/dev/null 2>&1"

  # The steps that sign, attest and read back a published image, shown each
  # failure they exist for. It runs the same action the build job runs after
  # its push (.github/actions/sign-attest-verify), on throwaway images in a
  # registry on this runner, signed with keys made here: nothing reaches
  # Docker Hub, GitHub's attestation store or Sigstore's public log. The cases:
  # nothing planted; the real attestation step failing, as Rekor made
  # aws-kubectl's fail on 2 November 2026 (this job has no OIDC token, so it
  # fails before it contacts anything); signing failing; signing skipped without a word; a tag
  # another run moved to an image signed by a stranger's key; a push that
  # stopped half way. tests/signing-plants.sh says what each must show.
  signing:
    name: Signing, shown each failure it must survive
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    # No id-token: write, ever. Without it the attestation step can only
    # fail, and setup refuses to run if a token is available.
    permissions:
      contents: read
    env:
      OWN_SIGNATURE_WAIT: "15"
    services:
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.6.1"

      - name: Throwaway keys, and an image for each case in the local registry
        id: setup
        run: ./tests/signing-plants.sh setup

      - name: Nothing planted
        id: untouched
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/untouched
          digest: ${{ steps.setup.outputs.untouched }}
          tags: |
            localhost:5000/untouched:latest
            localhost:5000/untouched:edge
          plant: none
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: the attestation fails"
        id: attest_fails
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/attest-fails
          digest: ${{ steps.setup.outputs.attest_fails }}
          tags: |
            localhost:5000/attest-fails:latest
            localhost:5000/attest-fails:kube-1.37
          plant: attest-fails
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: signing fails"
        id: sign_fails
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/sign-fails
          digest: ${{ steps.setup.outputs.sign_fails }}
          tags: localhost:5000/sign-fails:latest
          plant: sign-fails
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: signing is skipped without a word"
        id: sign_skipped
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/sign-skipped
          digest: ${{ steps.setup.outputs.sign_skipped }}
          tags: |
            localhost:5000/sign-skipped:latest
            localhost:5000/sign-skipped:edge
          plant: sign-skipped
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: another run moved a tag to an image this workflow did not sign"
        id: moved
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/moved
          digest: ${{ steps.setup.outputs.moved }}
          tags: |
            localhost:5000/moved:main
            localhost:5000/moved:kube-1.37
          other-run-wait: "20"
          plant: none
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: the push stopped half way"
        id: unfinished
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/unfinished
          digest: ""
          tags: |
            localhost:5000/unfinished:2.3.1
            localhost:5000/unfinished:2.3
          other-run-wait: "0"
          plant: none
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: Each failure was noticed, and every image this run built is signed
        env:
          KEY: ${{ steps.setup.outputs.key }}
          UNTOUCHED: ${{ steps.setup.outputs.untouched }}
          ATTEST_FAILS: ${{ steps.setup.outputs.attest_fails }}
          SIGN_FAILS: ${{ steps.setup.outputs.sign_fails }}
          SIGN_SKIPPED: ${{ steps.setup.outputs.sign_skipped }}
          MOVED: ${{ steps.setup.outputs.moved }}
          MOVED_OTHER: ${{ steps.setup.outputs.moved_other }}
          UNFINISHED: ${{ steps.setup.outputs.unfinished }}
          UNTOUCHED_OUTCOME: ${{ steps.untouched.outcome }}
          ATTEST_FAILS_OUTCOME: ${{ steps.attest_fails.outcome }}
          SIGN_FAILS_OUTCOME: ${{ steps.sign_fails.outcome }}
          SIGN_SKIPPED_OUTCOME: ${{ steps.sign_skipped.outcome }}
          MOVED_OUTCOME: ${{ steps.moved.outcome }}
          UNFINISHED_OUTCOME: ${{ steps.unfinished.outcome }}
        run: ./tests/signing-plants.sh check

  build:
    name: Build and publish kubectl ${{ matrix.line.minor }}
    runs-on: ubuntu-latest
    # Nothing is published that the test has not passed.
    needs: [lint, versions, test, signing]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.versions.outputs.lines) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Hub credentials are set
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::this repository has no DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret; add both (a Docker Hub access token with write access to heyvaldemar/kubectl) and run the workflow again"
            exit 1
          fi

      - name: Compute build metadata
        id: meta-build
        env:
          VERSION: ${{ matrix.line.version }}
        run: |
          set -euo pipefail
          {
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "vcs_ref=${GITHUB_SHA}"
            echo "patch=${VERSION#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tags bitnami/kubectl users already write: latest, the minor
      # (1.37) and the patch release (1.37.1). Each moves with the weekly
      # rebuild, so a pinned tag still receives security updates; pin a digest
      # for an image that never changes.
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ matrix.line.newest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ matrix.line.minor }}
            type=raw,value=${{ steps.meta-build.outputs.patch }}
          labels: |
            org.opencontainers.image.title=kubectl
            org.opencontainers.image.description=kubectl on Debian 13, one Kubernetes minor per tag, rebuilt weekly, signed; a drop-in for bitnami/kubectl.
            org.opencontainers.image.vendor=heyvaldemar
            org.opencontainers.image.licenses=MIT
            io.heyvaldemar.kubectl.version=${{ matrix.line.version }}

      # COSIGN IS INSTALLED BEFORE ANYTHING IS PUSHED. On 5 November 2026, in
      # heyvaldemar/kubectl-docker, GitHub answered cosign-installer 504 after
      # the push: signing could not run, and 1.36 and 1.36.6 named an unsigned
      # image for 89 minutes. A failed install now fails the job while nothing
      # is public yet; the signing action below finds this cosign and does not
      # download it again.
      - name: Install cosign before anything is pushed
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.6.1"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 20
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KUBE_VERSION=${{ matrix.line.version }}
            VCS_REF=${{ steps.meta-build.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.meta-build.outputs.build_date }}
          cache-from: type=gha,scope=kubectl-${{ matrix.line.minor }}
          cache-to: type=gha,mode=max,scope=kubectl-${{ matrix.line.minor }}
          sbom: true
          provenance: mode=max

      # SIGN FIRST, THEN ATTEST, THEN READ BACK WHAT DOCKER HUB SERVES. The
      # cosign steps used to follow the attestation and ran only if it
      # succeeded; in aws-kubectl, which had the same steps, a Rekor 502 on
      # 2 November 2026 left three tags on an unsigned image for 37 hours. Now
      # the pushed digest is signed whatever the attestation does, an
      # attestation that fails still fails the job, and then every tag pushed
      # here is read back from Docker Hub: the digest it names must carry a
      # cosign signature that verifies as this workflow, or the job fails (and
      # a digest this job built is signed again). It runs even when the push
      # failed half way: the build reports no digest then, so the tags it
      # already moved are reported, not signed. The signing job above runs the
      # same action with each failure planted.
      - name: Sign, attest, and read back every pushed tag from Docker Hub
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.meta.outcome == 'success' }}
        uses: ./.github/actions/sign-attest-verify
        with:
          image: ${{ env.IMAGE_NAME }}
          digest: ${{ steps.build.outcome == 'success' && steps.build.outputs.digest || '' }}
          tags: ${{ steps.meta.outputs.tags }}

  scan-trivy:
    name: Scan published kubectl ${{ matrix.line.minor }} with Trivy
    runs-on: ubuntu-latest
    needs: [versions, build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.versions.outputs.lines) }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The digest ${{ matrix.line.minor }} names now
        id: digest
        env:
          MINOR: ${{ matrix.line.minor }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${MINOR}" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::could not resolve ${IMAGE_NAME}:${MINOR}"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Findings do not fail this job; a scan that cannot finish does.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.line.minor }}

  # The ruleset requires checks by names that stay put while Kubernetes minors
  # enter and leave the lines. The matrix jobs are named by minor, so this one
  # stands for all of them, and fails if any line failed or was skipped.
  published:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: [lint, versions, test, signing, build]
    if: always()
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every line was tested and built
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, versions, test, signing, build: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a job this one stands for ended '$r'"; exit 1; }
          done

  dockerhub-description:
    name: Sync Docker Hub description
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "kubectl, one Kubernetes minor per tag, rebuilt weekly and signed. A drop-in for bitnami/kubectl."
          readme-filepath: ./README.md
